[package]
name = "orthodag"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "Draw a directed graph as Unicode box-drawing text."
keywords = ["graph", "dag", "ascii", "terminal", "layout"]
categories = ["visualization", "command-line-interface"]
repository = "https://github.com/txmxthy/orthodag"
exclude = [".github/", "justfile", "rust-toolchain.toml", "docs/plan.md"]

[features]
default = []
# Read a graph from Mermaid flowchart source, and write one back.
mermaid = []
# Write Mermaid and DOT back out.
dot = []
# Serialise public inputs, drawings and diagnostics.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
insta = "1.48"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
# pedantic opt-outs that cost more than they give
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[[example]]
name = "compare"
required-features = ["mermaid"]

[[example]]
name = "corpus"
required-features = ["mermaid"]

[[example]]
name = "why"
required-features = ["mermaid"]
